<!DOCTYPE html>
<html>
<head>
<title>Add Food Donation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI;
}

/* ===== BACKGROUND ===== */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1e3c72);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    overflow:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* FLOATING BLURS */
.blob{
    position:absolute;
    width:250px;
    height:250px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    filter:blur(40px);
    animation:float 8s infinite ease-in-out;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-40px);}
    100%{transform:translateY(0);}
}

/* ===== CARD ===== */
.card{
    width:420px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
    z-index:2;
}

/* TITLE */
h2{
    text-align:center;
    margin-bottom:5px;
}

p{
    text-align:center;
    font-size:12px;
    opacity:0.7;
    margin-bottom:15px;
}

/* INPUTS */
input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    outline:none;
    background:rgba(255,255,255,0.12);
    color:white;
    transition:0.3s;
}

input::placeholder{
    color:#ddd;
}

input:focus{
    background:rgba(255,255,255,0.2);
    box-shadow:0 0 10px rgba(255,255,255,0.2);
    transform:scale(1.02);
}

/* MAP BUTTON */
.map{
    display:block;
    text-align:center;
    padding:10px;
    margin-top:5px;
    background:#4285F4;
    color:white;
    border-radius:10px;
    text-decoration:none;
    font-size:13px;
    transition:0.3s;
}

.map:hover{
    transform:scale(1.05);
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#ff9800,#ff5722);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* RESPONSIVE */
@media(max-width:500px){
    .card{
        width:90%;
    }
}

</style>
</head>

<body>

<!-- BACKGROUND BLOBS -->
<div class="blob" style="top:10%;left:15%;"></div>
<div class="blob" style="bottom:10%;right:10%;"></div>

<!-- CARD -->
<div class="card">

    <h2>🍱 Donate Food</h2>
    <p>“One plate can change someone’s life”</p>

    <form method="POST" enctype="multipart/form-data">

        <input type="text" name="food_name" placeholder="🍛 Food Name" required>

        <input type="text" name="quantity" placeholder="🍽 Quantity (e.g. 5 plates)" required>

        <input type="text" name="category" placeholder="🥗 Veg / Non-Veg" required>

        <input type="text" name="prepared_time" placeholder="⏰ Prepared Time" required>

        <input type="text" name="expiry_time" placeholder="⌛ Expiry Time" required>

        <input id="addressInput" type="text" name="address"
placeholder="📍 Pickup Address" required>

<input
    type="file"
    name="food_image"
    accept="image/*"
    required
    style="
        width:100%;
        padding:10px;
        margin-top:10px;
        background:rgba(255,255,255,0.12);
        color:white;
        border:none;
        border-radius:10px;
    "
>

<a id="mapLink" class="map" href="#" target="_blank">
            🌍 Open in Google Maps
        </a>

        <button type="submit">🍱 Donate Food Now</button>

    </form>

</div>

<script>
const input = document.getElementById("addressInput");
const link = document.getElementById("mapLink");

input.addEventListener("input", function () {
    const query = encodeURIComponent(input.value);
    link.href = "https://www.google.com/maps/search/?api=1&query=" + query;
});
</script>

</body>
</html>
