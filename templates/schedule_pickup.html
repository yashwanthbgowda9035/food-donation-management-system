<!DOCTYPE html>
<html>
<head>
    <title>Schedule Pickup</title>
</head>

<body style="
    margin:0;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* FOOD + DONATION DELIVERY BACKGROUND */
    background:url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') 
    no-repeat center center/cover;
">

<!-- DARK OVERLAY -->
<div style="
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
"></div>

<!-- MAIN CARD -->
<div style="
    position:relative;
    width:420px;
    background:rgba(255,255,255,0.95);
    padding:30px;
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
    text-align:center;
">

    <h1 style="margin-bottom:10px; color:#2a5298;">
        🍱 Schedule Food Pickup
    </h1>

    <p style="color:#666; font-size:13px; margin-bottom:15px;">
        Assign pickup time for food donation delivery
    </p>

    <!-- DELIVERY IMAGE -->
    <img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png"
         style="width:100px; margin-bottom:15px;">

    <form method="POST">

        <label style="font-weight:bold; display:block; text-align:left;">
            📅 Pickup Date
        </label>

        <input type="date" name="pickup_date" required
        style="
            width:100%;
            padding:12px;
            margin:8px 0 15px 0;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:14px;
            outline:none;
        ">

        <label style="font-weight:bold; display:block; text-align:left;">
            ⏰ Pickup Time
        </label>

        <input type="time" name="pickup_time" required
        style="
            width:100%;
            padding:12px;
            margin:8px 0 15px 0;
            border:1px solid #ddd;
            border-radius:10px;
            font-size:14px;
            outline:none;
        ">

        <button type="submit"
        style="
            width:100%;
            padding:12px;
            margin-top:10px;
            background:linear-gradient(135deg,#ff9800,#ff5722);
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        "
        onmouseover="this.style.transform='scale(1.05)'"
        onmouseout="this.style.transform='scale(1)'">

            🍱 Confirm Food Pickup
        </button>

    </form>

</div>

</body>
</html>
